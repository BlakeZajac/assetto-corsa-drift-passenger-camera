[SETTINGS]
SIDE = 0 ; Side; 0 for left, 1 for right
LATERAL = 1.05 ; Distance out from the car centre; from 0.4 m to 2.5, round to 0.05
LONGITUDINAL = -0.35 ; Forward offset along the car (negative sits back toward the cabin); from -2 m to 2, round to 0.05
HEIGHT = 1.55 ; Height above the car origin, just clear of the roof on the 350Z; from 0.8 m to 3, round to 0.05
LOOK_AHEAD = 6 ; Aim point ahead of the car; from 2 m to 20, round to 0.1
AIM_HEIGHT = 0.5 ; Aim point height above the car origin; from 0 m to 2, round to 0.05
FOV = 50 ; Field of view; from 35 to 95, round to 1
HORIZON_LOCK = 0.72 ; Horizon stability (100% keeps the horizon level while the mount still follows the car); from 0 to 1, perc.
SMOOTHING = 1 ; Aim smoothing multiplier (higher is slower); from 0.35 to 2.5, round to 0.05
__HINT_BOTTOM = Select this script in CSP chase camera settings. Left is the passenger side of a right-hand-drive car. The mount stays on the body; only the aim point is smoothed. The far chase slot sits 0.2 m further out and 0.15 m higher. Raise Height if the camera clips the roof of a taller car.
